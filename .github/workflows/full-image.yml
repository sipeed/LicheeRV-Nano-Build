name: NanoKVM Full Image

# Builds the complete, flashable NanoKVM SD image (Cube / PCIe, SG2002) from
# source, in three jobs - 1 and 2 run in parallel, 3 consumes both:
#
#   1. web    - React frontend (pnpm). Cached: the pnpm content-addressable
#               store, i.e. everything that ends up in node_modules, keyed on
#               web/pnpm-lock.yaml.
#   2. kvmapp - riscv64 application layer built inside the nanokvm-builder
#               image from GHCR (same image as package.yml): kvm_system,
#               libkvm.so/dl_lib and NanoKVM-Server. Cached: Go module cache,
#               Go build cache, and the MaixCDK CMake build trees. The build
#               trees are the ccache equivalent for the C++ side: the builder
#               image ships no ccache and its container runs unprivileged, so
#               incremental cmake state is cached instead. The two binaries and
#               the fresh dl_lib set are uploaded as an artifact.
#   3. image  - assembles nanokvm_<version>.tar.gz from the two artifacts
#               (scripts/package.sh), then does the full BSP build of the base
#               system (sipeed/LicheeRV-Nano-Build, NanoKVM branch: cvisetup +
#               defconfig sg2002_licheervnano_sd + build_all). Cached here:
#               ccache fronting the host and the riscv64 musl/elf cross
#               compilers (the SDK's own USE_CCACHE hook is enabled too),
#               buildroot's own ccache (BR2_CCACHE is already on in its
#               defconfig; only its default ~/.buildroot-ccache dir needed
#               caching), the buildroot download dir, the 0.82GB host-tools
#               tarball and the apt download archive. Then the upstream
#               kvm/merge_nanokvm_app.sh injects the freshly built kvmapp into
#               the base image. The merged image is verified, compressed and
#               uploaded as a flashable .img.xz. The base <ts>.img itself is
#               cached per SDK commit + patch set, so runs with an unchanged
#               SDK skip the 1.5-2h build_all entirely.
#
# Where the sources come from (this file's canonical home is the
# LicheeRV-Nano-Build repository, whose NanoKVM branch is the SDK):
#   - SDK tree: if this workflow runs in a repo named LicheeRV-Nano-Build
#     (this repo or a fork), the hosting checkout's own NanoKVM-branch code is
#     built at the triggering commit; otherwise sipeed/LicheeRV-Nano-Build is
#     cloned by default - override with the sdk_repository / sdk_ref inputs.
#     Always checked out at licheervnano/.
#   - app tree: the NanoKVM application is cloned from sipeed/NanoKVM by
#     default (or taken from the triggering commit when this workflow runs in
#     a repo named NanoKVM) - override with the nanokvm_repository /
#     nanokvm_ref inputs. Always checked out at nanokvm/.
#
# Everything heavy is deliberately workflow_dispatch-only. Building blocks are
# proven in "NanoKVM 整盘镜像构建笔记" (workspace notes) and in the tested
# wsl-fixes/licheervnano-host-linux-amd64.yml workflow, including the two
# NanoKVM-branch build regressions patched below:
#   - minimal-board dts misses the #if (CVIMMAP_FRAMEBUFFER_SIZE > 0) guard
#     around &fb_reserved/&cvi_fb, which breaks `make dtbs`;
#   - middleware Makefile_full compiles sensor sources with bare $(CFLAGS) and
#     misses -I$(KERNEL_INC), which breaks libsns_full.
# merge_nanokvm_app.sh needs libfuse2 on the host (it uses the BSP's bundled
# fuse2fs, unprivileged) and is run under bash to avoid its dash EXIT-trap
# quirk that can report a non-zero status on success.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version baked into /kvmapp/version, e.g. 2.5.4 (default 0.0.<run number>)
        required: false
        type: string
      nanokvm_repository:
        description: NanoKVM app tree repository (default this repo if named NanoKVM, else sipeed/NanoKVM)
        required: false
        type: string
      nanokvm_ref:
        description: NanoKVM app tree branch/tag/commit (default the triggering commit, else the app default branch)
        required: false
        type: string
      sdk_repository:
        description: Base-image SDK repository (default this repo if named LicheeRV-Nano-Build, else sipeed/LicheeRV-Nano-Build)
        required: false
        type: string
      sdk_ref:
        description: SDK branch/tag/commit (default the triggering commit, else the NanoKVM branch)
        required: false
        type: string
      rebuild_base:
        description: Ignore the cached base image and rebuild the SDK from scratch
        required: false
        type: boolean
        default: false

concurrency:
  group: nanokvm-full-image
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1/3 - frontend (runs in parallel with job 2)
  # ---------------------------------------------------------------------------
  web:
    name: Job 1/3 - Frontend (web)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve NanoKVM app source
        id: appsrc
        env:
          INPUT_REPO: ${{ inputs.nanokvm_repository }}
          INPUT_REF: ${{ inputs.nanokvm_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          host="${GITHUB_REPOSITORY}"
          if [ -n "$INPUT_REPO" ]; then
            repo="$INPUT_REPO"
            if [ "$repo" = "$host" ]; then ref="${INPUT_REF:-$HEAD_SHA}"; else ref="${INPUT_REF:-main}"; fi
          elif [ "${host##*/}" = "NanoKVM" ]; then
            # The workflow file lives in the NanoKVM app repo: build exactly
            # the commit this run was dispatched on.
            repo="$host"
            ref="$HEAD_SHA"
          else
            # Hosted in another repo (e.g. LicheeRV-Nano-Build): clone the
            # upstream app tree; override via the nanokvm_* inputs.
            repo="sipeed/NanoKVM"
            ref="${INPUT_REF:-main}"
            echo "NanoKVM app tree: using $repo@$ref (host repo is not the app tree; override with nanokvm_repository / nanokvm_ref)"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "NanoKVM app source: $repo @ $ref"

      - name: Checkout NanoKVM app tree
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.appsrc.outputs.repo }}
          ref: ${{ steps.appsrc.outputs.ref }}
          path: nanokvm
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Latest Node release line (26 = current LTS since 2026-10); the
          # frontend only requires >=22 (web/package.json engines).
          node-version: '26'

      - name: Set up pnpm
        working-directory: nanokvm/web
        run: |
          npm install --global pnpm@11
          pnpm --version
          # Pin the store to a known path so the cache below always matches.
          pnpm config set store-dir "$HOME/.pnpm-store" --global

      - name: Restore pnpm store (node_modules cache)
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('nanokvm/web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        working-directory: nanokvm/web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: nanokvm/web
        run: pnpm build

      - name: Verify build output
        run: test -f nanokvm/web/dist/index.html

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: fullimg-web-dist
          path: nanokvm/web/dist
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2/3 - riscv64 application layer (kvmapp); runs in parallel with job 1
  # ---------------------------------------------------------------------------
  kvmapp:
    name: Job 2/3 - riscv64 application (server + kvm_system + vision)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    outputs:
      builder_image: ${{ steps.image.outputs.digest_ref }}

    steps:
      - name: Resolve NanoKVM app source
        id: appsrc
        env:
          INPUT_REPO: ${{ inputs.nanokvm_repository }}
          INPUT_REF: ${{ inputs.nanokvm_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          host="${GITHUB_REPOSITORY}"
          if [ -n "$INPUT_REPO" ]; then
            repo="$INPUT_REPO"
            if [ "$repo" = "$host" ]; then ref="${INPUT_REF:-$HEAD_SHA}"; else ref="${INPUT_REF:-main}"; fi
          elif [ "${host##*/}" = "NanoKVM" ]; then
            # The workflow file lives in the NanoKVM app repo: build exactly
            # the commit this run was dispatched on.
            repo="$host"
            ref="$HEAD_SHA"
          else
            # Hosted in another repo (e.g. LicheeRV-Nano-Build): clone the
            # upstream app tree; override via the nanokvm_* inputs.
            repo="sipeed/NanoKVM"
            ref="${INPUT_REF:-main}"
            echo "NanoKVM app tree: using $repo@$ref (host repo is not the app tree; override with nanokvm_repository / nanokvm_ref)"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "NanoKVM app source: $repo @ $ref"

      - name: Checkout NanoKVM app tree
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.appsrc.outputs.repo }}
          ref: ${{ steps.appsrc.outputs.ref }}
          path: nanokvm
          fetch-depth: 1
          persist-credentials: false

      - name: Pull builder image
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # GHCR only accepts lowercase repository paths.
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          PRIMARY="ghcr.io/$owner/nanokvm-builder:latest"
          FALLBACK="ghcr.io/sipeed/nanokvm-builder:latest"

          pull_retry() {
            local ref="$1" ok=0 attempt
            for attempt in 1 2 3; do
              if docker pull "$ref"; then
                ok=1
                break
              fi
              echo "pull attempt $attempt failed, retrying in 15s"
              sleep 15
            done
            [ "$ok" -eq 1 ]
          }

          REF=""
          if pull_retry "$PRIMARY"; then
            REF="$PRIMARY"
          elif [ "$EVENT_NAME" != "pull_request" ] \
               && printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin \
               && pull_retry "$PRIMARY"; then
            # The owner's image may be private (built by the Builder Image
            # workflow); the anonymous pull above failed, retry with a token.
            REF="$PRIMARY"
          elif pull_retry "$FALLBACK"; then
            # Hosts without their own GHCR image fall back to the upstream
            # toolchain image, which matches docker/Dockerfile.
            REF="$FALLBACK"
            echo "builder image: $PRIMARY unavailable; using upstream $FALLBACK (run the NanoKVM 'Builder Image' workflow to publish your own to GHCR)"
          else
            echo "::error::could not pull a nanokvm-builder image (tried $PRIMARY and $FALLBACK)"
            exit 1
          fi

          RESOLVED_REF=$(docker image inspect --format='{{index .RepoDigests 0}}' "$REF")
          case "$RESOLVED_REF" in
            *@sha256:*) ;;
            *)
              echo "::error::could not resolve immutable digest for $REF (got '$RESOLVED_REF')"
              exit 1
              ;;
          esac
          echo "Using builder image $RESOLVED_REF"
          echo "digest_ref=$RESOLVED_REF" >> "$GITHUB_OUTPUT"

      - name: Restore Go module cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/nanokvm-ci/go-mod
          key: go-mod-${{ hashFiles('nanokvm/server/go.sum') }}
          restore-keys: |
            go-mod-

      - name: Restore Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/nanokvm-ci/go-build
          key: go-build-${{ steps.image.outputs.digest_ref }}-${{ hashFiles('nanokvm/server/go.sum') }}
          restore-keys: |
            go-build-

      - name: Restore MaixCDK CMake build trees (C++ incremental cache)
        uses: actions/cache@v6
        with:
          path: |
            nanokvm/support/sg2002/kvm_system/build
            nanokvm/support/sg2002/kvm_vision_test/build
          key: maixcdk-${{ steps.image.outputs.digest_ref }}-${{ hashFiles('nanokvm/support/sg2002/**') }}
          restore-keys: |
            maixcdk-${{ steps.image.outputs.digest_ref }}-

      - name: Build riscv64 artifacts in the builder container
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest_ref }}
        run: |
          set -euo pipefail
          # The cache volumes must exist and be owned by the runner user before
          # docker bind-mounts them, otherwise docker creates them as root and
          # the container build user (same numeric uid) cannot write.
          mkdir -p "$HOME/.cache/nanokvm-ci/go-mod" "$HOME/.cache/nanokvm-ci/go-build"

          run_build() {
            docker run -e UID="$(id -u)" -e GID="$(id -g)" \
              -v "$PWD/nanokvm":/home/build/NanoKVM \
              -v "$HOME/.cache/nanokvm-ci/go-mod":/home/build/go/pkg/mod \
              -v "$HOME/.cache/nanokvm-ci/go-build":/home/build/.cache/go-build \
              --rm "$IMAGE_REF" \
              /bin/bash -c '/home/build/NanoKVM/scripts/build-in-container.sh'
          }

          # Restored CMake trees are incremental state, not sources; if they
          # are somehow inconsistent, drop them and rebuild from scratch once.
          if ! run_build; then
            echo "::warning::build failed; clearing cached CMake trees and retrying clean"
            rm -rf nanokvm/support/sg2002/kvm_system/build nanokvm/support/sg2002/kvm_vision_test/build
            run_build
          fi

      - name: Verify riscv64 artifacts
        run: |
          set -euo pipefail
          # ELF e_machine 243 = riscv64; package.sh repeats this on packaging,
          # but catching a wrong-arch build here fails the right job.
          for f in \
            nanokvm/server/NanoKVM-Server \
            nanokvm/kvmapp/kvm_system/kvm_system \
            nanokvm/kvmapp/server/dl_lib/libkvm.so; do
            test -f "$f" || { echo "::error::missing build artifact $f"; exit 1; }
            machine=$(od -An -tu1 -j18 -N1 "$f" | tr -d ' ')
            if [ "$machine" != "243" ]; then
              echo "::error::$f is not riscv64 (ELF e_machine=$machine)"
              exit 1
            fi
            echo "  ok riscv64  $f"
          done

      - name: Upload riscv64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fullimg-riscv64-bin
          path: |
            nanokvm/server/NanoKVM-Server
            nanokvm/kvmapp/kvm_system/kvm_system
            nanokvm/kvmapp/server/dl_lib
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 3/3 - package + base system image (SDK build) + kvmapp merge
  # ---------------------------------------------------------------------------
  image:
    name: Job 3/3 - Full SD image (SDK build + kvmapp merge)
    needs: [web, kvmapp]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SDK_DIR: licheervnano
      APP_DIR: nanokvm
      APP_ROOT: ${{ github.workspace }}/app-root
      CACHE_ROOT: /mnt/nanokvm-fullimg-cache

    steps:
      - name: Free up disk space
        run: |
          echo "Before:"
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune -af || true
          # The ccache and buildroot-download caches live on the secondary
          # disk to keep them off the root filesystem the SDK build occupies.
          # /mnt itself is root-owned, so hand the cache root to the runner.
          sudo mkdir -p "$CACHE_ROOT"
          sudo chown "$(id -u):$(id -g)" "$CACHE_ROOT"
          echo "After:"
          df -h / /mnt || true

      - name: Resolve names
        id: names
        env:
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-0.0.${GITHUB_RUN_NUMBER}}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::invalid version '$VERSION', expected MAJOR.MINOR.PATCH"
            exit 1
          fi
          BUILD_DATE=$(date +%Y%m%d)
          SHORT_SHA=$(printf '%s' "$HEAD_SHA" | cut -c1-12)
          {
            echo "version=$VERSION"
            echo "build_date=$BUILD_DATE"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"

      - name: Resolve NanoKVM app source
        id: appsrc
        env:
          INPUT_REPO: ${{ inputs.nanokvm_repository }}
          INPUT_REF: ${{ inputs.nanokvm_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          host="${GITHUB_REPOSITORY}"
          if [ -n "$INPUT_REPO" ]; then
            repo="$INPUT_REPO"
            if [ "$repo" = "$host" ]; then ref="${INPUT_REF:-$HEAD_SHA}"; else ref="${INPUT_REF:-main}"; fi
          elif [ "${host##*/}" = "NanoKVM" ]; then
            repo="$host"
            ref="$HEAD_SHA"
          else
            repo="sipeed/NanoKVM"
            ref="${INPUT_REF:-main}"
            echo "NanoKVM app tree: using $repo@$ref (host repo is not the app tree; override with nanokvm_repository / nanokvm_ref)"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "NanoKVM app source: $repo @ $ref"
          echo "APP_REPO=$repo" >> "$GITHUB_ENV"
          echo "APP_REF=$ref" >> "$GITHUB_ENV"

      - name: Checkout NanoKVM app tree
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.appsrc.outputs.repo }}
          ref: ${{ steps.appsrc.outputs.ref }}
          path: nanokvm
          fetch-depth: 1
          persist-credentials: false

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: fullimg-web-dist
          path: nanokvm/web/dist

      - name: Download riscv64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: fullimg-riscv64-bin
          path: nanokvm

      - name: Assemble application package
        working-directory: nanokvm
        env:
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/package.sh "$VERSION"

      - name: Verify package manifest
        working-directory: nanokvm
        env:
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          set -euo pipefail
          TARBALL="build/release/nanokvm_${VERSION}.tar.gz"
          EXPECTED=$(jq -er '.sha512 | select(type == "string" and length > 0)' build/release/latest.json)
          ACTUAL=$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::latest.json sha512 does not match $TARBALL"
            exit 1
          fi
          sha256sum "$TARBALL"

      - name: Verify and unpack kvmapp payload
        working-directory: nanokvm
        env:
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          set -euo pipefail
          TARBALL="build/release/nanokvm_${VERSION}.tar.gz"
          test -f "$TARBALL" || { echo "::error::missing $TARBALL"; exit 1; }
          # merge_nanokvm_app.sh wants -a <dir containing kvmapp/>; the
          # packaged tarball is its most reliable source (single root dir).
          mkdir -p "$APP_ROOT/kvmapp"
          tar -xzf "$TARBALL" -C "$APP_ROOT/kvmapp" --strip-components=1
          # Artifact zips may drop the executable bit, and the merge script
          # checks these two binaries before its own chmod -R +x.
          chmod u+x "$APP_ROOT/kvmapp/server/NanoKVM-Server" \
                    "$APP_ROOT/kvmapp/kvm_system/kvm_system"
          test -x "$APP_ROOT/kvmapp/server/NanoKVM-Server"
          test -x "$APP_ROOT/kvmapp/kvm_system/kvm_system"
          test -f "$APP_ROOT/kvmapp/system/ko/soph_mipi_rx.ko"
          test -f "$APP_ROOT/kvmapp/system/init.d/S95nanokvm"
          grep -qx "$VERSION" "$APP_ROOT/kvmapp/version" \
            || { echo "::error::kvmapp/version is not $VERSION"; exit 1; }
          echo "kvmapp payload ready at $APP_ROOT/kvmapp"

      - name: Resolve base-image SDK source
        id: sdksrc
        env:
          INPUT_REPO: ${{ inputs.sdk_repository }}
          INPUT_REF: ${{ inputs.sdk_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          host="${GITHUB_REPOSITORY}"
          if [ -n "$INPUT_REPO" ]; then
            repo="$INPUT_REPO"
            if [ "$repo" = "$host" ]; then ref="${INPUT_REF:-$HEAD_SHA}"; else ref="${INPUT_REF:-NanoKVM}"; fi
          elif [ "${host##*/}" = "LicheeRV-Nano-Build" ]; then
            # Canonical home: build the hosting fork's own NanoKVM-branch SDK
            # at the dispatched commit.
            repo="$host"
            ref="$HEAD_SHA"
          else
            repo="sipeed/LicheeRV-Nano-Build"
            ref="${INPUT_REF:-NanoKVM}"
            echo "::warning::host repo is not LicheeRV-Nano-Build; using $repo@$ref (override with sdk_repository / sdk_ref)"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "SDK source: $repo @ $ref"
          echo "SDK_REPO=$repo" >> "$GITHUB_ENV"
          echo "SDK_REF=$ref" >> "$GITHUB_ENV"

      - name: Checkout base-image SDK
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.sdksrc.outputs.repo }}
          ref: ${{ steps.sdksrc.outputs.ref }}
          path: licheervnano
          persist-credentials: false

      - name: Record SDK commit
        id: sdk
        run: |
          set -euo pipefail
          SHA=$(git -C "$SDK_DIR" rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "SDK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "SDK: ${SDK_REPO} @ ${SDK_REF} ($SHA)"

      - name: Restore apt download cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/nanokvm-ci/apt-archives
          key: apt-archives-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            apt-archives-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Dependency list from the SDK's host/ubuntu/Dockerfile (ubuntu
          # 22.04) plus the extras the tested fork workflow used. The runner
          # image moves on (ubuntu-latest migrated to 24.04 in 2024 and to
          # 26.04 in late 2026), and a few names are release-specific (e.g.
          # python3-distutils, libncurses5-dev, libegl1-mesa, slib are gone
          # there, and buildroot builds its own host python anyway), so check
          # what can actually be installed and skip the rest - loudly.
          PACKAGES="\
            android-libext4-utils android-sdk-libsparse-utils asciinema autoconf automake autotools-dev \
            bc bdebstrap binutils-riscv64-unknown-elf bison build-essential bzr ccache \
            ca-certificates chrpath ckermit cmake cpio cpp-riscv64-linux-gnu \
            crossbuild-essential-riscv64 cscope curl cvs debianutils device-tree-compiler \
            diffstat dosfstools erofs-utils fakechroot fakeroot fatcat file flex gettext \
            g++-riscv64-linux-gnu gawk gcc-riscv64-linux-gnu gcc-riscv64-unknown-elf \
            genext2fs git help2man iputils-ping jq libacl1 libasan8-riscv64-cross \
            libatomic1-riscv64-cross libc6-dbg-riscv64-cross libc6-dev-riscv64-cross \
            libconfuse-dev libegl1-mesa libfuse2t64 liblz4-tool libncurses-dev \
            libncurses5-dev libsdl1.2-dev libssl-dev libtool-bin locales make mercurial \
            mesa-common-dev mmdebstrap mtools neovim ninja-build openssh-server openssl \
            parallel parted picolibc-riscv64-unknown-elf pkg-config proot python3 \
            python3-dev python3-distutils python3-flake8 python3-git python3-jinja2 \
            python3-magic python3-nose2 python3-pexpect python3-pip python3-pytest \
            python3-subunit rsync scons shellcheck slib socat squashfs-tools ssh \
            ssh-client subversion tclsh texinfo tree unzip wget xz-utils zstd"
          # Resolve what can actually be installed on this runner image. A
          # plain `apt-cache show` is NOT enough: names that are merely
          # "referred to by another package" with no installation candidate
          # (python3-distutils and slib on newer Ubuntu) still succeed there
          # and abort the real install with exit 100. `apt-get --simulate`
          # applies the exact same resolution as the real install. Fast path:
          # one simulation of the whole list; only if that fails, fall back to
          # a per-package simulation to drop just the names without candidates.
          # shellcheck disable=SC2086 # word splitting of the package list is intended
          if apt-get install --simulate $PACKAGES >/dev/null 2>&1; then
            echo "all requested packages have installation candidates"
            installable="$PACKAGES"
            unavailable=""
          else
            installable=""
            unavailable=""
            # shellcheck disable=SC2086 # word splitting of the package list is intended
            for pkg in $PACKAGES; do
              if apt-get install --simulate "$pkg" >/dev/null 2>&1; then
                installable="$installable $pkg"
              else
                unavailable="$unavailable $pkg"
              fi
            done
          fi
          if [ -n "$unavailable" ]; then
            echo "::warning::packages with no installation candidate on this runner image, skipping:$unavailable"
          fi
          # Seed apt's archive dir from the restored download cache so
          # unchanged .debs are not re-downloaded, then collect everything
          # back into the user-owned dir for the cache save.
          mkdir -p "$HOME/.cache/nanokvm-ci/apt-archives"
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo cp "$HOME"/.cache/nanokvm-ci/apt-archives/*.deb \
                  /var/cache/apt/archives/ 2>/dev/null || true
          # shellcheck disable=SC2086 # word splitting of the package list is intended
          sudo apt-get install -y $installable
          sudo cp /var/cache/apt/archives/*.deb \
                  "$HOME/.cache/nanokvm-ci/apt-archives/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/nanokvm-ci/apt-archives"

      # Idempotent patches ported from wsl-fixes/licheervnano-host-linux-amd64.yml
      # (which they were ported from the local wsl-fixes scripts). If a patch
      # aborts (exit 2), upstream changed the file: review instead of forcing.
      - name: Patch NanoKVM-HEAD build regressions
        id: patches
        working-directory: licheervnano
        run: |
          set -e
          DTS=build/boards/sg200x/sg2002_licheervnano_sd_minimal/dts_riscv/sg2002_licheervnano_sd_minimal.dts
          python3 - "$DTS" <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          t = open(p, newline="").read()
          guard = "#if (CVIMMAP_FRAMEBUFFER_SIZE > 0)"
          if re.search(re.escape(guard) + r"\n&fb_reserved \{", t):
              print("dts: guard already present, skip")
              sys.exit(0)
          pat = re.compile(
              r'(&fb_reserved \{\n)'
              r'([ \t]*)status = "okay";\n'
              r'\};\n'
              r'\n'
              r'(&cvi_fb \{\n)'
              r'([ \t]*)status = "okay";\n'
              r'\};\n'
          )
          ms = list(pat.finditer(t))
          if len(ms) != 1:
              print("dts ABORT: expected exactly 1 unguarded fb block, found %d" % len(ms))
              sys.exit(2)
          m = ms[0]
          rep = (guard + "\n"
                 '&fb_reserved {\n' + m.group(2) + 'status = "okay";\n'
                 '};\n\n'
                 '&cvi_fb {\n' + m.group(4) + 'status = "okay";\n'
                 '};\n'
                 '#endif\n')
          open(p, "w", newline="").write(t[:m.start()] + rep + t[m.end():])
          print("dts FIXED: wrapped &fb_reserved/&cvi_fb in CVIMMAP_FRAMEBUFFER_SIZE guard")
          PYEOF
          MF=middleware/v2/component/isp/sensor/cv182x/Makefile_full
          python3 - "$MF" <<'PYEOF'
          import sys
          p = sys.argv[1]
          t = open(p, newline="").read()
          mark = "CFLAGS += -I$(MW_INC) -I$(ISP_INC) -I$(KERNEL_INC)"
          if mark in t:
              print("Makefile_full: already patched, skip")
              sys.exit(0)
          anchor = "include ../../sensor.mk\n"
          n = t.count(anchor)
          if n != 1:
              print("Makefile_full ABORT: expected exactly 1 anchor, found %d" % n)
              sys.exit(2)
          open(p, "w", newline="").write(t.replace(anchor, anchor + mark + "\n", 1))
          print("Makefile_full FIXED: added -I$(MW_INC) -I$(ISP_INC) -I$(KERNEL_INC) to libsns_full CFLAGS")
          PYEOF
          # Part of the base-image cache key: a patch change must rebuild.
          PATCH_HASH=$(git diff --binary | sha256sum | cut -c1-12)
          echo "patch_hash=$PATCH_HASH" >> "$GITHUB_OUTPUT"
          git diff --stat || true

      # ccache fronts both the host compilers and the sophgo riscv64 musl
      # cross compiler. The board defconfig uses
      # CONFIG_CROSS_COMPILE="riscv64-unknown-linux-musl-" (a PATH name, not
      # an absolute path), so masquerading by name catches kernel/uboot/
      # middleware cross builds as well; builds that invoke the compiler by
      # absolute path simply bypass ccache (pass-through, never broken).
      - name: Set up ccache
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_ROOT/ccache" "$HOME/.ccache-bin"
          BIN=$(command -v ccache)
          for c in gcc g++ cc c++ \
                   riscv64-unknown-linux-musl-gcc riscv64-unknown-linux-musl-g++ \
                   riscv64-unknown-linux-musl-c++ \
                   riscv64-unknown-elf-gcc riscv64-unknown-elf-g++ \
                   riscv64-unknown-elf-c++; do
            ln -sf "$BIN" "$HOME/.ccache-bin/$c"
          done
          ccache -o max_size=3G \
                 -o sloppiness=file_macro,include_file_mtime,include_file_ctime,time_macros \
                 -o hash_dir=false \
                 -o base_dir="$GITHUB_WORKSPACE"
          echo "$HOME/.ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$CACHE_ROOT/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "ccache wrapper dir: $HOME/.ccache-bin (prepended to PATH)"

      - name: Restore host-tools tarball cache
        # Key is static on purpose: the tarball URL is versioned by its path,
        # so bump this key if the URL ever changes.
        uses: actions/cache@v6
        with:
          path: licheervnano/host-tools.tar.gz
          key: host-tools-v1

      - name: Download cross toolchain (host-tools)
        working-directory: licheervnano
        run: |
          set -euo pipefail
          # Needed both by build_all and by merge_nanokvm_app.sh (strip tool
          # fallback). The 0.82GB tarball is cached and only re-downloaded
          # when the cache is cold; extraction reruns each time.
          if [ ! -x host-tools/gcc/riscv64-linux-musl-x86_64/bin/riscv64-unknown-linux-musl-strip ]; then
            if [ ! -f host-tools.tar.gz ]; then
              wget -q --tries=3 https://sophon-file.sophon.cn/sophon-prod-s3/drive/23/03/07/16/host-tools.tar.gz
            fi
            tar xf host-tools.tar.gz
          fi
          host-tools/gcc/riscv64-linux-musl-x86_64/bin/riscv64-unknown-linux-musl-gcc --version | head -1

      - name: Restore cached base image
        id: baseimg
        if: inputs.rebuild_base != true
        uses: actions/cache/restore@v6
        with:
          path: licheervnano/install/soc_sg2002_licheervnano_sd/images
          key: base-img-${{ steps.sdk.outputs.sha }}-${{ steps.patches.outputs.patch_hash }}

      - name: Decide whether the SDK build is needed
        id: decide
        run: |
          set -euo pipefail
          should=1
          if [ "${{ inputs.rebuild_base }}" = "true" ]; then
            echo "rebuild_base requested -> building the SDK from scratch"
            base_source="built"
          elif [ "${{ steps.baseimg.outputs.cache-hit }}" != "true" ]; then
            echo "no cached base image for this SDK commit + patch set -> building"
            base_source="built"
          elif compgen -G "$SDK_DIR/install/soc_sg2002_licheervnano_sd/images/*.img" >/dev/null; then
            echo "cached base image restored -> skipping build_all"
            should=0
            base_source="cache"
          else
            echo "::warning::cache claimed a hit but no image was restored; building"
            base_source="built"
          fi
          echo "should_build=$should" >> "$GITHUB_OUTPUT"
          echo "BASE_SOURCE=$base_source" >> "$GITHUB_ENV"

      - name: Restore ccache
        if: steps.decide.outputs.should_build == '1'
        uses: actions/cache/restore@v6
        with:
          path: /mnt/nanokvm-fullimg-cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Restore buildroot ccache
        # The board's effective buildroot defconfig already sets BR2_CCACHE=y;
        # buildroot only needs its default ~/.buildroot-ccache to survive.
        if: steps.decide.outputs.should_build == '1'
        uses: actions/cache/restore@v6
        with:
          path: ~/.buildroot-ccache
          key: brccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            brccache-${{ runner.os }}-

      - name: Restore buildroot download cache
        if: steps.decide.outputs.should_build == '1'
        uses: actions/cache/restore@v6
        with:
          path: /mnt/nanokvm-fullimg-cache/buildroot-dl
          key: buildroot-dl-${{ steps.sdk.outputs.sha }}
          restore-keys: |
            buildroot-dl-

      - name: Redirect buildroot downloads into the cache
        if: steps.decide.outputs.should_build == '1'
        working-directory: licheervnano
        run: |
          set -euo pipefail
          # A directory symlink keeps buildroot's default DL_DIR working no
          # matter what the SDK makefiles export, and keeps multi-GB package
          # downloads (qt5base/qt5svg are the usual flake) off the root disk.
          mkdir -p "$CACHE_ROOT/buildroot-dl"
          rm -rf buildroot/dl
          ln -s "$CACHE_ROOT/buildroot-dl" buildroot/dl
          # Cap buildroot's ccache store so the shared Actions cache budget
          # stays bounded (the dir itself is what gets cached/saved).
          mkdir -p "$HOME/.buildroot-ccache"
          if ! grep -q '^max_size' "$HOME/.buildroot-ccache/ccache.conf" 2>/dev/null; then
            printf 'max_size = 2G\n' > "$HOME/.buildroot-ccache/ccache.conf"
          fi

      - name: Build base system (build_all)
        if: steps.decide.outputs.should_build == '1'
        working-directory: licheervnano
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          # The SDK's own ccache hook: envsetup_soc.sh creates ccache wrappers
          # for the aarch64/arm toolchains when this is y (riscv64 musl/elf
          # are already covered by the ~/.ccache-bin masquerade above).
          export USE_CCACHE=y
          source build/cvisetup.sh
          # cvisetup may prepend the sophgo toolchain; put the ccache
          # masquerade back in front so cross builds are cached too.
          export PATH="$HOME/.ccache-bin:$PATH"
          ccache --zero-stats
          defconfig sg2002_licheervnano_sd
          set -o pipefail
          # buildroot source downloads (qt5svg/qt5base) occasionally flake on
          # the first run; build_all is incremental, so one retry suffices.
          build_all 2>&1 | tee build_all.log \
            || { echo "::warning::build_all failed once; retrying incrementally"; \
                 build_all 2>&1 | tee -a build_all.log; }
          ccache --show-stats || true
          IMG_COUNT=$(find install/soc_sg2002_licheervnano_sd/images -maxdepth 1 \
                        -type f -name '*.img' | wc -l)
          if [ "$IMG_COUNT" -eq 0 ]; then
            echo "::error::build_all produced no .img in install/soc_sg2002_licheervnano_sd/images"
            exit 1
          fi

      - name: Save base image to cache
        if: steps.decide.outputs.should_build == '1'
        uses: actions/cache/save@v6
        with:
          path: licheervnano/install/soc_sg2002_licheervnano_sd/images
          key: base-img-${{ steps.sdk.outputs.sha }}-${{ steps.patches.outputs.patch_hash }}

      - name: Save ccache
        if: steps.decide.outputs.should_build == '1'
        uses: actions/cache/save@v6
        with:
          path: /mnt/nanokvm-fullimg-cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Save buildroot ccache
        if: steps.decide.outputs.should_build == '1'
        uses: actions/cache/save@v6
        with:
          path: ~/.buildroot-ccache
          key: brccache-${{ runner.os }}-${{ github.run_id }}

      - name: Save buildroot download cache
        if: steps.decide.outputs.should_build == '1'
        uses: actions/cache/save@v6
        with:
          path: /mnt/nanokvm-fullimg-cache/buildroot-dl
          key: buildroot-dl-${{ steps.sdk.outputs.sha }}

      - name: Merge kvmapp into the base image
        working-directory: licheervnano
        run: |
          set -euo pipefail
          IMAGES_DIR="$PWD/install/soc_sg2002_licheervnano_sd/images"
          BASE_IMG=$(find "$IMAGES_DIR" -maxdepth 1 -type f -name '*.img' \
                       ! -name '*-nanokvm.img' -printf '%T@ %p\n' \
                       | sort -nr | head -n1 | cut -d' ' -f2-)
          if [ -z "$BASE_IMG" ]; then
            echo "::error::no base image found in $IMAGES_DIR"
            exit 1
          fi
          echo "base image: $BASE_IMG"
          # Run under bash (the script's shebang is /bin/sh = dash, whose EXIT
          # trap can report a non-zero status on success). The script copies
          # input -> output first, so a retry is always safe.
          if ! bash kvm/merge_nanokvm_app.sh -i "$BASE_IMG" -a "$APP_ROOT" -f 2>&1 \
               | tee merge_nanokvm_app.log; then
            echo "::warning::merge_nanokvm_app.sh failed once; retrying"
            bash kvm/merge_nanokvm_app.sh -i "$BASE_IMG" -a "$APP_ROOT" -f 2>&1 \
              | tee -a merge_nanokvm_app.log
          fi
          MERGED=$(find "$IMAGES_DIR" -maxdepth 1 -type f -name '*-nanokvm.img' \
                     -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          if [ -z "$MERGED" ]; then
            echo "::error::merge produced no output image"
            exit 1
          fi
          echo "MERGED=$MERGED" >> "$GITHUB_ENV"

      - name: Verify image contents
        working-directory: licheervnano
        env:
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          set -euo pipefail
          LOOP=$(sudo losetup -fP --show "$MERGED")
          mkdir -p vmnt && sudo mount -o ro "${LOOP}p2" vmnt
          M=vmnt fail=0
          ck() { if eval "$2"; then echo "  OK   $1"; else echo "  FAIL $1"; fail=1; fi; }
          ck "rcS present (services boot)"    "[ -f $M/etc/init.d/rcS ]"
          ck "S95nanokvm executable"          "[ -x $M/etc/init.d/S95nanokvm ]"
          ck "kvm_system binary"              "[ -s $M/kvmapp/kvm_system/kvm_system ]"
          ck "NanoKVM-Server"                 "[ -s $M/kvmapp/server/NanoKVM-Server ]"
          ck "web UI"                         "[ -f $M/kvmapp/server/web/index.html ]"
          ck "dl_lib shared libraries"        "[ \$(ls $M/kvmapp/server/dl_lib/*.so 2>/dev/null | wc -l) -gt 0 ]"
          ck "soph_mipi_rx.ko"                "[ -f $M/mnt/system/ko/soph_mipi_rx.ko ]"
          ck "frpc"                           "[ -x $M/usr/bin/frpc ]"
          ck "tailscaled"                     "[ -x $M/usr/sbin/tailscaled ]"
          ck "kvm_new_img marker"             "[ -e $M/kvmapp/kvm_new_img ]"
          ck "ssh_stop marker"                "[ -e $M/etc/kvm/ssh_stop ]"
          ck "version is $VERSION"            "[ \"\$(cat $M/kvmapp/version)\" = \"$VERSION\" ]"
          sync; sudo umount vmnt; sudo losetup -d "$LOOP"
          if [ "$fail" -eq 0 ]; then
            echo "IMAGE VERIFICATION PASSED"
          else
            echo "IMAGE VERIFICATION FAILED"
            exit 1
          fi

      - name: Cache and disk statistics
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache --show-stats || true; fi
          if [ -d "$HOME/.buildroot-ccache" ] && command -v ccache >/dev/null 2>&1; then
            CCACHE_DIR="$HOME/.buildroot-ccache" ccache --show-stats || true
          fi
          du -sh "$HOME/.cache/nanokvm-ci/apt-archives" 2>/dev/null || true
          df -h / /mnt || true

      - name: Compress and stage final image
        working-directory: licheervnano
        env:
          VERSION: ${{ steps.names.outputs.version }}
          BUILD_DATE: ${{ steps.names.outputs.build_date }}
        run: |
          set -euo pipefail
          IMAGES_DIR="$PWD/install/soc_sg2002_licheervnano_sd/images"
          cd "$IMAGES_DIR"
          FINAL="${BUILD_DATE}_NanoKVM_${VERSION}-nanokvm.img"
          mv "$MERGED" "$FINAL"
          # .img.xz flashes directly in balenaEtcher / dd; keep the run's
          # checksum alongside.
          xz -T0 -6 "$FINAL"
          sha256sum "$FINAL.xz" > "$FINAL.xz.sha256"
          test -f "$FINAL.xz"
          ls -lh "$FINAL.xz"
          echo "FINAL_IMG=$IMAGES_DIR/$FINAL.xz" >> "$GITHUB_ENV"
          echo "FINAL_NAME=$FINAL.xz" >> "$GITHUB_ENV"
          SHA256_HEX=$(cut -d' ' -f1 "$FINAL.xz.sha256")
          echo "FINAL_SHA256=$SHA256_HEX" >> "$GITHUB_ENV"

      - name: Stage final artifacts
        working-directory: nanokvm
        env:
          VERSION: ${{ steps.names.outputs.version }}
          BUILD_DATE: ${{ steps.names.outputs.build_date }}
          HEAD_SHA: ${{ github.sha }}
          BUILDER_IMAGE: ${{ needs.kvmapp.outputs.builder_image }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          cp "$FINAL_IMG" "../dist/$FINAL_NAME"
          cp "$(dirname "$FINAL_IMG")/$FINAL_NAME.sha256" ../dist/
          cp build/release/latest.json ../dist/
          APP_SHA512=$(jq -er '.sha512' build/release/latest.json)
          cat > ../dist/BUILD_INFO.txt <<EOF
          artifact=nanokvm-fullimg-${VERSION}-${{ steps.names.outputs.short_sha }}
          version=${VERSION}
          image=${FINAL_NAME}
          image_sha256_hex=${FINAL_SHA256}
          app_package=nanokvm_${VERSION}.tar.gz
          app_sha512_base64=${APP_SHA512}
          app_repository=${APP_REPO}
          app_ref=${APP_REF}
          event=${GITHUB_EVENT_NAME}
          nanokvm_repo=${GITHUB_REPOSITORY}
          nanokvm_sha=${HEAD_SHA}
          sdk_repository=${SDK_REPO}
          sdk_ref=${SDK_REF}
          sdk_sha=${SDK_SHA}
          builder_image=${BUILDER_IMAGE}
          base_image_source=${BASE_SOURCE}
          build_date=${BUILD_DATE}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          cat ../dist/BUILD_INFO.txt

      - name: Upload final image artifact
        uses: actions/upload-artifact@v7
        with:
          name: nanokvm-fullimg-${{ steps.names.outputs.version }}-${{ steps.names.outputs.short_sha }}
          path: dist
          retention-days: 30
          if-no-files-found: error

      - name: Compress build logs
        if: failure()
        continue-on-error: true
        working-directory: licheervnano
        run: gzip -f -9 build_all.log merge_nanokvm_app.log || true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nanokvm-fullimg-logs-${{ github.run_id }}
          path: |
            licheervnano/build_all.log.gz
            licheervnano/merge_nanokvm_app.log.gz
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload base image on failure
        # If only the merge/verify failed, the expensive base image is still
        # good - do not make the user rebuild it.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nanokvm-fullimg-base-${{ github.run_id }}
          path: licheervnano/install/soc_sg2002_licheervnano_sd/images/*.img
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo '### NanoKVM full image'
            echo
            if [ -n "${VERSION:-}" ]; then
              echo "- Version: \`${VERSION}\` (baked into /kvmapp/version)"
            fi
            echo "- NanoKVM app source: \`${APP_REPO:-n/a} @ ${APP_REF:-n/a}\`"
            echo "- SDK: \`${SDK_REPO:-n/a} @ ${SDK_REF:-n/a}\` (${SDK_SHA:-n/a})"
            echo "- Builder image: \`${{ needs.kvmapp.outputs.builder_image }}\`"
            echo "- Base image source: \`${BASE_SOURCE:-n/a}\` (cache or fresh build_all)"
            if [ -n "${FINAL_NAME:-}" ]; then
              echo
              echo '```text'
              echo "$FINAL_NAME"
              echo "sha256: $FINAL_SHA256"
              echo '```'
              echo
              echo 'Flash with balenaEtcher (accepts .img.xz) or:'
              echo
              echo '```bash'
              echo "xz -d $FINAL_NAME"
              echo 'sudo dd if=<image>.img of=/dev/sdX bs=4M conv=fsync status=progress'
              echo '```'
              echo
              echo 'First boot: `nanokvm.local` (mDNS), web on port 80.'
              echo 'SSH is disabled by default (`/etc/kvm/ssh_stop`); enable it in the web UI.'
            else
              echo
              echo 'No final image was produced. Check the failed step; if the merge'
              echo 'failed, the base image and logs are attached as artifacts.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
